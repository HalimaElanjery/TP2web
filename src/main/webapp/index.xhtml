<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <h:outputStylesheet name="css/mycsslayout.css"/>
    <h:outputScript name="js/script.js" target="head"/>
    <title>Conversation</title>
</h:head>
<h:body>
    <h:form id="form">
        <h:messages style="color: red"/>

        <h:panelGroup>
            <h:outputLabel for="role" value="Rôle de l'API : "/>
            <p:selectOneMenu id="role" value="#{bb.roleSysteme}" required="true"
                             requiredMessage="Choisissez un rôle"
                             disabled="#{not bb.roleSystemeChangeable}">
                <f:selectItem itemLabel="Choisir un rôle" itemValue="" noSelectionOption="true"/>
                <f:selectItems value="#{bb.rolesSysteme}"/>
            </p:selectOneMenu>
            <h:commandButton value="Nouveau chat" action="#{bb.nouveauChat}" immediate="true"/>
        </h:panelGroup>

        <h:panelGrid columns="2" columnClasses="topAligned,topAligned">

            <h:panelGroup id="panelgauche">
                <h:outputLabel for="question" value="Question : "/>
                <button type="button" onclick="copyToClipboard('question')">Copier question</button>
                <button type="button" onclick="toutEffacer()">Effacer question et réponse</button>
                <br/>
                <h:inputTextarea id="question" value="#{bb.question}" rows="5" cols="60"/>
                <br/>
                <h:commandButton value="Envoyer la question" action="#{bb.envoyer}"/>
                <br/>
                <h:outputLabel for="reponse" value="Réponse : "/>
                <button type="button" onclick="copyToClipboard('reponse')">Copier réponse</button>
                <br/>
                <h:inputTextarea id="reponse" value="#{bb.reponse}" rows="15" cols="60" readonly="true"/>
            </h:panelGroup>

            <h:panelGroup id="paneldroit">
                <h:outputLabel for="conversation" value="Conversation : "/>
                <button type="button" onclick="copyToClipboard('conversation')">Copier conversation</button>
                <br/>
                <h:inputTextarea id="conversation" value="#{bb.conversation}" rows="30" cols="60" readonly="true"/>
            </h:panelGroup>

        </h:panelGrid>
    </h:form>
</h:body>
</html>
